name: Publish

# To release, bump "version" in Cargo.toml and merge to main. This runs when Cargo.toml
# changes on main and publishes only if that version is not on npm yet, so merges that do not
# bump the version publish nothing.
#
# npm: trusted publishing (OIDC), so there is no long-lived npm token to leak. One-time setup
# after the first manual publish: npmjs.com → @contextflo/sqlparser-wasm → Settings → Trusted
# publishing → GitHub Actions, repository contextflo/sqlparser-wasm, workflow publish.yml.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Is this version already on npm?
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "Could not read the version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@contextflo/sqlparser-wasm@$version" version > /dev/null 2>&1; then
            echo "$version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  npm:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v4

      - run: rustup target add wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: cargo install wasm-pack --locked --version 0.15.1

      # Never publish a build whose cases have not passed
      - run: cargo test --locked
      - run: wasm-pack build --target nodejs --release --scope contextflo
      - run: node tests/smoke.mjs

      # Apache-2.0 requires NOTICE in redistributions; wasm-pack only copies README and LICENSE
      - name: Add NOTICE to the package
        run: |
          cp NOTICE pkg/NOTICE
          cd pkg
          npm pkg set "files[$(node -p 'require("./package.json").files.length')]=NOTICE"

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
        working-directory: pkg
