[package]
name = "sqlparser-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "WebAssembly build of Apache DataFusion's sqlparser-rs: which tables does a SQL query read. Fails closed."
repository = "https://github.com/contextflo/sqlparser-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# recursive-protection (on by default) pulls in stacker, which does not build for wasm32.
# The parser's own recursion limit (50) still bounds nesting.
sqlparser = { version = "=0.64.0", default-features = false, features = ["std", "visitor"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
